<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Sudoku</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <section class="hero">
      <p class="eyebrow">Git + GitHub 实战带练</p>
      <h1>Neon Sudoku</h1>
      <p class="subtitle">我们的目标：做一个酷炫、可玩的数独游戏，并在过程中学会规范的版本管理。</p>
    </section>

    <section class="panel">
      <div class="toolbar">
        <button id="new-game" type="button">新游戏</button>
        <button id="check-board" type="button">检查</button>
        <button id="reset-board" type="button">重置</button>
      </div>

      <div id="board" class="board" aria-label="数独棋盘"></div>

      <p id="message" class="message">第一步先把项目跑起来，后面我们再逐步加上真正的数独规则。</p>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
